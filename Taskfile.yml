# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: Create nginx-net if not exists, then start containers
    cmds:
      - |
        if ! docker network inspect nginx-net >/dev/null 2>&1; then
          echo "Creating docker network: nginx-net"
          docker network create nginx-net
        else
          echo "Docker network nginx-net already exists"
        fi
      - docker compose up -d

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down

  restart:
    desc: Restart containers
    cmds:
      - docker compose down
      - docker compose up -d

  upgrade:
    desc: Pull latest images, recreate containers, then remove dangling images
    cmds:
      - docker compose pull
      - docker compose up -d --force-recreate
      - docker image prune -f
